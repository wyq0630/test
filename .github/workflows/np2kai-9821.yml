name: np2kai-9821

# 云端交叉编译 NP2kai（Android arm64），带 9821 机型补丁
on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'pain 9821 patch (1=yes 0=no)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: info
        run: |
          echo "=== cpu ==="; nproc
          df -h / | tail -1

      - name: install ndk
        run: |
          set -e
          for V in r29 r27c r26d; do
            URL="https://dl.google.com/android/repository/android-ndk-${V}-linux.zip"
            echo "try $V"
            if curl -sSL --retry 2 --max-time 600 -o /tmp/ndk.zip "$URL"; then
              if unzip -t /tmp/ndk.zip >/dev/null 2>&1; then
                echo "OK $V"; break
              fi
            fi
            rm -f /tmp/ndk.zip
          done
          [ -f /tmp/ndk.zip ] || { echo "ndk download failed"; exit 1; }
          unzip -q /tmp/ndk.zip -d /opt
          NDK_DIR=$(ls -d /opt/android-ndk-* | head -1)
          echo "NDK=$NDK_DIR" >> $GITHUB_ENV
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E 'aarch64-linux-android24-clang$' | head -2

      - name: checkout
        uses: actions/checkout@v4

      - name: fetch source
        run: |
          set -e
          curl -sSL --retry 3 -o /tmp/np2k.zip "https://github.com/libretro/NP2kai/archive/refs/heads/master.zip"
          ls -lh /tmp/np2k.zip
          unzip -q /tmp/np2k.zip -d /tmp/src
          SRC=$(ls -d /tmp/src/NP2kai-* | head -1)
          echo "SRC=$SRC" >> $GITHUB_ENV
          ls "$SRC/sdl/" | head -5

      - name: apply patch
        if: ${{ github.event.inputs.patch == '1' }}
        run: |
          set -e
          cd $SRC
          cp pccore.c pccore.c.orig
          python3 "$GITHUB_WORKSPACE/ci/patch-9821.py" "$SRC/pccore.c"
          echo "=== verify ==="
          grep -n -A3 'PCMODEL_PC9821 | PCMODEL_VX' pccore.c | head -6

      - name: build
        run: |
          set -e
          cd $SRC
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC1=$BIN/aarch64-linux-android24-clang
          CXX1=$BIN/aarch64-linux-android24-clang++
          $CC1 --version | head -2
          make -C sdl -f Makefile.libretro \
            platform=unix \
            CC="$CC1" CXX="$CXX1" AR="$BIN/llvm-ar" \
            LDFLAGS="-lm" \
            -j$(nproc) 2>&1 | tail -60
          echo "=== artifact ==="
          find "$SRC" -name '*_libretro.so' -exec ls -lh {} \; 2>/dev/null

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: np2kai-android-arm64
          path: '**/*_libretro.so'
          if-no-files-found: error
