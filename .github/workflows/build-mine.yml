name: build-mine

# 完整闭环演示：本机写源码 -> 推仓库 -> 云端 NDK 编译 -> 产物拉回手机
# 与 fetch-build.yml 的区别：源码就在仓库里（不是运行时下载）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库（含我推上来的源码）
        uses: actions/checkout@v4

      - name: 2. 确认源码来自仓库
        run: |
          echo "=== 仓库内容 ==="
          ls -la src-demo/
          echo
          echo "=== 源码哈希（和本机对比）==="
          sha256sum src-demo/hashbench.c
          echo "行数: $(wc -l < src-demo/hashbench.c)"

      - name: 3. NDK 交叉编译 aarch64
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "编译器: $($CC --version | head -1)"
          $CC -O2 -o hashbench-ndk src-demo/hashbench.c
          mkdir -p out && cp hashbench-ndk out/
          file out/hashbench-ndk
          ls -l out/

      - name: 4. 在 runner 上先自测（x86 机器上跑不了，只看能否链接）
        run: |
          echo "=== 依赖检查 ==="
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          $READELF -d out/hashbench-ndk | head -8

      - name: 5. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: hashbench-aarch64
          path: out/
          if-no-files-found: error
