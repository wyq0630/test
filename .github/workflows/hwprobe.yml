name: hwprobe

# 探测 runner 的真实硬件参数
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CPU
        run: |
          echo "=== lscpu ==="
          lscpu
          echo
          echo "=== /proc/cpuinfo 首块 ==="
          head -30 /proc/cpuinfo
          echo
          echo "=== 型号 + 核数 ==="
          grep -m1 "model name" /proc/cpuinfo
          echo "逻辑核: $(nproc)   物理核: $(lscpu | awk -F: '/Core\(s\) per socket/{gsub(/ /,"",$2);print $2}') x $(lscpu | awk -F: '/Socket\(s\)/{gsub(/ /,"",$2);print $2}')"
          echo "缓存: $(lscpu | grep -i 'L3 cache' | cut -d: -f2 | xargs)"

      - name: 内存
        run: |
          echo "=== free -h ==="
          free -h
          echo
          echo "=== /proc/meminfo 关键项 ==="
          grep -E "MemTotal|MemAvailable|SwapTotal|Dirty" /proc/meminfo

      - name: 磁盘
        run: |
          echo "=== 挂载与容量 ==="
          df -h /
          df -h /mnt 2>/dev/null || true
          echo
          echo "=== 设备类型（看是否 SSD）==="
          lsblk -d -o NAME,SIZE,ROTA,TYPE,MODEL 2>/dev/null || true
          echo "  ROTA=0 表示非旋转盘（SSD）"
          echo
          echo "=== 顺序写速度（dd 2GB）==="
          dd if=/dev/zero of=/tmp/testfile bs=1M count=2048 conv=fdatasync 2>&1 | tail -1
          rm -f /tmp/testfile

      - name: 性能基准
        run: |
          echo "=== CPU 单核/多核（openssl sha256）==="
          echo "--- sha256 1 线程 ---"
          openssl speed -evp sha256 -seconds 2 2>/dev/null | tail -3 || true
          echo
          echo "=== 计算耗时对比（1 亿次循环）==="
          cat > bench.py <<'EOF'
          import time
          t=time.time()
          s=0
          for i in range(50_000_000):
              s += i
          print(f"  Python 5千万次累加: {time.time()-t:.2f}s")
          EOF
          time python3 bench.py
          echo
          echo "=== 编译基准（gcc 编译自身级别的小项目）==="
          printf '#include <stdio.h>\nint main(){printf("x\\n");return 0;}\n' > t.c
          time gcc -O2 t.c -o t
          echo "  单文件编译完成"

      - name: 网络
        run: |
          echo "=== 出网延迟/带宽（下载 100MB）==="
          curl -s -o /dev/null -w "  连 github.com: %{time_connect}s  首字节 %{time_starttransfer}s\n" https://github.com
          curl -sL -o /dev/null -w "  下载测速: %{speed_download} B/s  (size %{size_download})\n" \
            --max-time 30 https://speed.cloudflare.com/__down?bytes=104857600 || true
