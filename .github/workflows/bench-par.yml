name: bench-par

# 对照实验：同一批 5 个 dex（17.8 MB），三种并行策略
#   ① serial          : 单 job，串行 for
#   ② parallel_onejob : 单 job，4 路并行（纵向跑满核）
#   ③ matrix_jobs     : 5 个 job，每 job 一个 dex（横向拉宽）
#
# [KEY] jadx 对混淆代码会返回非 0，而 run 步骤默认 set -e -> 必须 || true
on:
  workflow_dispatch:

jobs:
  serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 准备
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx && chmod +x /tmp/jadx/bin/jadx
          echo "/tmp/jadx/bin" >> $GITHUB_PATH
          mkdir -p dex && unzip -qo samples-dex.zip -d dex
      - name: 串行反编译
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          for d in dex/*.dex; do
            jadx -d "out-serial-$(basename $d)" --no-res -q "$d" || true
          done
          E=$(date +%s)
          N=$(find out-serial-* -name '*.java' 2>/dev/null | wc -l)
          echo "RESULT serial_seconds=$((E-S)) java=$N"
      - uses: actions/upload-artifact@v4
        with: {name: r-serial, path: "*.txt", if-no-files-found: ignore}

  parallel_onejob:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 准备
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx && chmod +x /tmp/jadx/bin/jadx
          mkdir -p dex && unzip -qo samples-dex.zip -d dex
          echo "nproc=$(nproc)"
      - name: 4 路并行反编译
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          for d in dex/*.dex; do
            b=$(basename $d)
            ( jadx -d "out-par-$b" --no-res -q "$d" || true ) &
          done
          wait
          E=$(date +%s)
          N=$(find out-par-* -name '*.java' 2>/dev/null | wc -l)
          echo "RESULT parallel_onejob_seconds=$((E-S)) java=$N"

  matrix_jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dex: [classes.dex, classes2.dex, classes3.dex, classes4.dex, classes5.dex]
    steps:
      - uses: actions/checkout@v4
      - name: 准备
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx && chmod +x /tmp/jadx/bin/jadx
          mkdir -p dex && unzip -qo samples-dex.zip -d dex "${{ matrix.dex }}"
      - name: 反编译（本 job 单线程）
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          jadx -d "out-${{ matrix.dex }}" --no-res -q "dex/${{ matrix.dex }}" || true
          E=$(date +%s)
          N=$(find out-${{ matrix.dex }} -name '*.java' 2>/dev/null | wc -l)
          echo "RESULT ${{ matrix.dex }} seconds=$((E-S)) java=$N"
