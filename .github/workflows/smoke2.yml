name: smoke2-ndk

# 目的：产出能在 Android/Termux 原生运行的二进制
#
# [KEY] 为什么不用 gcc-aarch64-linux-gnu：
#   那是 glibc 工具链。Android 用的是 bionic libc + seccomp 过滤器，
#   glibc 静态二进制启动时就会触发非法系统调用，被 SIGSYS(31) 杀掉。
#   必须用 Android NDK（bionic）。
on:
  workflow_dispatch:

env:
  NDK_VERSION: r27c
  API: "24"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 找 NDK（先用 runner 预装的，省时间）
        id: ndk
        run: |
          set -x
          # GitHub runner 常预装 Android SDK，里面可能带 NDK
          for d in "$ANDROID_HOME/ndk"/* /usr/local/lib/android/sdk/ndk/*; do
            [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ] && { echo "NDK=$d" >> $GITHUB_OUTPUT; echo "找到预装: $d"; exit 0; }
          done
          echo "未预装，改为下载 NDK $NDK_VERSION"
          cd /tmp
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          ls -l ndk.zip
          unzip -q ndk.zip
          echo "NDK=/tmp/android-ndk-${NDK_VERSION}" >> $GITHUB_OUTPUT

      - name: 2. NDK 工具链信息
        run: |
          NDK="${{ steps.ndk.outputs.NDK }}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$TC" | grep -E "^aarch64-linux-android[0-9]+-clang$" | head -5
          "$TC/aarch64-linux-android${API}-clang" --version | head -2

      - name: 3. 编译（glibc 对照组 + bionic 动态 + bionic 静态）
        run: |
          NDK="${{ steps.ndk.outputs.NDK }}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TC/aarch64-linux-android${API}-clang"

          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <sys/utsname.h>' \
            'int main(void){' \
            '  struct utsname u;' \
            '  if(uname(&u)==0)' \
            '    printf("hello from CI (bionic) | machine=%s release=%s\n", u.machine, u.release);' \
            '  else' \
            '    printf("hello from CI (bionic) | uname failed\n");' \
            '  return 0;' \
            '}' > hello.c

          echo "=== bionic 动态（默认，链 Android 系统的 libc.so）==="
          $CC -O2 -o hello-bionic hello.c
          file hello-bionic

          echo "=== bionic 静态 ==="
          $CC -O2 -static -o hello-bionic-static hello.c
          file hello-bionic-static

          echo "=== glibc 对照组（预期在手机上跑不了，作对照证据）==="
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -o hello-glibc hello.c
          file hello-glibc

          ls -l hello-bionic hello-bionic-static hello-glibc

      - name: 4. 上传三个产物
        uses: actions/upload-artifact@v4
        with:
          name: bionic-binaries
          path: |
            hello-bionic
            hello-bionic-static
            hello-glibc
          if-no-files-found: error
