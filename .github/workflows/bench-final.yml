name: bench-final

# 最终对照：所有方案同时起跑 + 每个 job 打印 CPU 型号（识别硬件彩票）
# 同一时间窗内比较才有效
on:
  workflow_dispatch:

jobs:
  baseline_serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 硬件指纹
        run: |
          grep -m1 "model name" /proc/cpuinfo
      - name: 基线：串行 + jadx 默认4线程
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx; export PATH=/tmp/jadx/bin:$PATH
          mkdir -p dex && unzip -qo samples-dex.zip -d dex
          S=$(date +%s)
          for d in dex/*.dex; do jadx -d "o-$(basename $d)" --no-res -q "$d" || true; done
          echo "RESULT baseline_serial=$(( $(date +%s) - S ))"

  in_job_multi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -m1 "model name" /proc/cpuinfo
      - name: 单 job 内并行 5 进程（各默认4线程）
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx; export PATH=/tmp/jadx/bin:$PATH
          mkdir -p dex && unzip -qo samples-dex.zip -d dex
          S=$(date +%s)
          i=0; for d in dex/*.dex; do i=$((i+1)); ( jadx -d "m-$i" --no-res -q "$d" || true ) & done; wait
          echo "RESULT in_job_multi=$(( $(date +%s) - S ))"

  matrix_5jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dex: [classes.dex, classes2.dex, classes3.dex, classes4.dex, classes5.dex]
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -m1 "model name" /proc/cpuinfo
      - name: 每 job 一个 dex
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx; export PATH=/tmp/jadx/bin:$PATH
          mkdir -p dex && unzip -qo samples-dex.zip -d dex "${{ matrix.dex }}"
          S=$(date +%s)
          jadx -d "x" --no-res -q "dex/${{ matrix.dex }}" || true
          echo "RESULT matrix_${{ matrix.dex }}=$(( $(date +%s) - S ))"

  baseline_repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -m1 "model name" /proc/cpuinfo
      - name: 基线重复（测噪声）
        run: |
          curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q -o /tmp/j.zip -d /tmp/jadx; export PATH=/tmp/jadx/bin:$PATH
          mkdir -p dex && unzip -qo samples-dex.zip -d dex
          S=$(date +%s)
          for d in dex/*.dex; do jadx -d "r-$(basename $d)" --no-res -q "$d" || true; done
          echo "RESULT baseline_repeat=$(( $(date +%s) - S ))"
