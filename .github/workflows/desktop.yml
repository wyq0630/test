name: desktop

# 在 runner 里搭一个图形桌面，经隧道暴露到浏览器
#
# [KEY] GitHub hosted runner 是 Azure VM，但：
#   - 无图形界面（默认 headless）
#   - 无入站端口（无法直接 SSH/VNC 进去）
#   所以只能「在内部起桌面 + 向外打隧道」，用浏览器访问。
#
# [HIGH] 安全：public 仓库的 workflow 日志是公开的 —— 隧道 URL 会被人看到。
#   这里用 permissions: {} 让 GITHUB_TOKEN 失效，并加 VNC 密码，
#   使陌生人即便拿到 URL 也进不去、也拿不到任何凭据。
on:
  workflow_dispatch:

permissions: {}          # [HIGH] 关键：不给这个作业任何仓库凭据

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 装桌面 + VNC + noVNC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xfce4 xfce4-terminal dbus-x11 \
            tigervnc-standalone-server tigervnc-common \
            novnc websockify
          echo "装完: $(dpkg -l | grep -c '^ii') 个包"

      - name: 起 VNC（xfce4 桌面）
        run: |
          mkdir -p ~/.vnc
          PW=$(head -c 12 /dev/urandom | base64 | tr -d '/+=' | head -c 10)
          echo "$PW" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          echo "VNC_PASSWORD=$PW" >> $GITHUB_ENV

          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

          vncserver :1 -geometry 1600x900 -depth 24 -localhost yes
          echo "--- 监听端口 ---"
          ss -ltnp | grep -E '5901|6080' || true

      - name: 起 noVNC（网页版 VNC，6080）
        run: |
          nohup websockify --web=/usr/share/novnc 6080 localhost:5901 > /tmp/ws.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "  本地 noVNC: HTTP %{http_code}\n" http://localhost:6080/vnc.html

      - name: 打隧道（cloudflared quick tunnel，免账号）
        run: |
          curl -sSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 3
          done
          if [ -z "$URL" ]; then echo "隧道失败，日志："; tail -30 /tmp/cf.log; exit 1; fi
          echo "================================"
          echo "  打开这个（手机浏览器也行）:"
          echo "  $URL/vnc.html?autoconnect=1&resize=scale"
          echo "================================"
          echo "  VNC 密码: $VNC_PASSWORD"
          echo "================================"
          echo "$URL" > /tmp/url.txt

      - name: 保持会话 25 分钟
        run: |
          echo "会话已就绪，25 分钟后自动结束（也可以点 Cancel 提前终止）"
          sleep 1500
