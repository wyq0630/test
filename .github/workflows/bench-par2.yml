name: bench-par2

# 追问：既然单个 jadx 默认占 4 线程（= CI 的全部核数），
# 那把它限成 1 线程再并行开 5 个，能不能压榨出更多？
#   serial_4t   : 串行，每个 jadx 用默认 4 线程（= 基线）
#   par_1t_x5   : 并行 5 个，每个 jadx 限 1 线程（5 进程抢 4 核）
#   par_2t_x3   : 并行 3 个，每个 jadx 限 2 线程（6 线程抢 4 核）
#   serial_1t   : 串行，每个 jadx 限 1 线程（对照：单核总工作量）
on:
  workflow_dispatch:

env:
  SETUP: |
    curl -sSL -o /tmp/j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
    unzip -q -o /tmp/j.zip -d /tmp/jadx && chmod +x /tmp/jadx/bin/jadx
    export PATH=/tmp/jadx/bin:$PATH
    mkdir -p dex && unzip -qo samples-dex.zip -d dex

jobs:
  serial_4t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ${{ env.SETUP }}
      - name: 串行 4线程（基线）
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          for d in dex/*.dex; do jadx -j 4 -d "o-$RANDOM" --no-res -q "$d" || true; done
          echo "RESULT serial_4t=$(( $(date +%s) - S ))"

  par_1t_x5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ${{ env.SETUP }}
      - name: 并行5个 x 各1线程
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          i=0
          for d in dex/*.dex; do i=$((i+1)); ( jadx -j 1 -d "o1-$i" --no-res -q "$d" || true ) & done
          wait
          echo "RESULT par_1t_x5=$(( $(date +%s) - S ))"

  par_2t_x3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ${{ env.SETUP }}
      - name: 并行3个 x 各2线程
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          ls dex/*.dex | xargs -P 3 -I{} sh -c "jadx -j 2 -d o2-\$(basename {} .dex) --no-res -q {} || true"
          echo "RESULT par_2t_x3=$(( $(date +%s) - S ))"

  serial_1t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ${{ env.SETUP }}
      - name: 串行 1线程（单核总工作量）
        run: |
          export PATH=/tmp/jadx/bin:$PATH
          S=$(date +%s)
          for d in dex/*.dex; do jadx -j 1 -d "os-$RANDOM" --no-res -q "$d" || true; done
          echo "RESULT serial_1t=$(( $(date +%s) - S ))"
