name: cpucmp

# EPYC vs 手机：跑同一个基准源，对比实测
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: CPU 信息
        run: |
          grep -m1 "model name" /proc/cpuinfo
          echo "逻辑核: $(nproc)"
          lscpu | grep -E "^CPU\(s\)|Thread|Core|Socket|MHz|L3|BogoMIPS" | sed 's/^/  /'

      - name: 编译
        run: gcc -O2 -o cpu_bench src-demo/cpu_bench.c -lpthread && file cpu_bench

      - name: 跑 3 次
        run: |
          for i in 1 2 3; do
            echo "--- 第 $i 次 ---"
            ./cpu_bench 8
          done
