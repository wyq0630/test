name: timeout-test

# 实测：作业执行时间上限从哪一刻开始算
# 做法：timeout-minutes 设 2，但 sleep 300（5 分钟）
# 预期：若从「作业开始执行」算 -> 约 2 分钟就被杀；若含排队则更早
on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 记录时间后长睡
        run: |
          date -u +"STARTED %Y-%m-%dT%H:%M:%SZ"
          echo "现在开始 sleep 300s，理论上会被 2 分钟上限杀掉"
          sleep 300
          echo "不该看到这行"
