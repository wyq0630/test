name: bomb-analyze

# 在 CI（4 核 / 16GB 内存 / SSD）里解剖 zipbomb
# 为什么放 CI：426MB 解压 + 全量周期扫描，手机内存和 CPU 都吃紧
on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          echo "CPU: $(nproc) 核"; free -h | head -2; df -h / | tail -1

      - name: 解剖 bomb
        run: |
          python3 src-demo/analyze_bomb.py samples/bomb-entry.zip 2>&1 | tee report.txt

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: bomb-report
          path: report.txt
          if-no-files-found: error
