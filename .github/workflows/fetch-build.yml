name: fetch-build

# 证明：仓库里只需放 workflow（配方），源码在运行时从网上取（食材）
on:
  workflow_dispatch:
    inputs:
      url:
        description: "源码 tarball 的 URL"
        required: false
        default: "https://codeload.github.com/lz4/lz4/tar.gz/refs/tags/v1.10.0"
      name:
        description: "产物命名"
        required: false
        default: "lz4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 0. 证明仓库里没有源码
        run: |
          echo "=== 工作区内容 ==="
          ls -la
          echo "=== 有没有 .c/.h 文件 ==="
          find . -name "*.c" -o -name "*.h" | grep -v '^$' | head -5
          echo "  (上面为空 = 仓库里确实没有源码)"

      - name: 1. 运行时下载源码
        run: |
          curl -sSL -o src.tar.gz "${{ inputs.url }}"
          ls -l src.tar.gz
          mkdir -p src && tar xzf src.tar.gz -C src --strip-components=1
          echo "=== 解出内容 ==="
          ls src | head -12
          echo "C 源文件数: $(find src -name '*.c' | wc -l)"

      - name: 2. NDK 交叉编译到 aarch64
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd src
          make -j$(nproc) CC="$TC/aarch64-linux-android24-clang" AR="$TC/llvm-ar" 2>&1 | tail -18
          mkdir -p ../out
          find . -maxdepth 2 \( -name "liblz4*.so*" -o -name "liblz4.a" -o -name "lz4" \) -type f \
            -exec cp -v {} ../out/ \;
          echo "=== 产物 ==="
          ls -l ../out
          file ../out/*

      - name: 3. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-aarch64
          path: out/
          if-no-files-found: error
