name: handwrite

# 字体渲染 A4 手写页（无 AI 标识 —— 字体排版不属 AI 生成内容）
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "只出前 N 页（0=全部）"
        default: "2"
      seed:
        description: "随机种子（换一个就换一套扰动）"
        default: "20261014"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: pip install --quiet pillow numpy

      - name: 下字体（直链，不走 API —— runner 共享 IP 会撞匿名限流）
        run: |
          set -e
          mkdir -p fonts
          B=https://github.com
          get() {  # get <url> <out> <最小字节数>
            curl -fSL --retry 3 --retry-delay 2 -o "fonts/$2" "$1"
            sz=$(stat -c %s "fonts/$2")
            echo "  $2 -> $sz B"
            [ "$sz" -ge "$3" ] || { echo "!! $2 太小，可能下到错误页"; return 1; }
          }
          get $B/lxgw/yozai-font/releases/download/v0.868/Yozai-Medium.ttf        Yozai.ttf    10000000
          get $B/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Regular.ttf  WenKai.ttf   20000000
          get $B/lxgw/LxgwNeoXiHei/releases/download/v1.305/LXGWNeoXiHei.ttf      NeoXiHei.ttf  5000000
          echo "--- 文件类型校验 ---"
          file fonts/*.ttf
          ls -la fonts/

      - name: 渲染（3 种字体 × 前 N 页）
        run: |
          N="${{ inputs.pages }}"
          for f in Yozai WenKai NeoXiHei; do
            echo "=== $f ==="
            python3 src-demo/handwrite.py --font fonts/$f.ttf \
              --text src-demo/content.txt --out out-$f \
              --pages "$N" --seed "${{ inputs.seed }}"
          done

      - name: 生成小预览（供手机快速查看）
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import glob, os
          os.makedirs("preview", exist_ok=True)
          for p in sorted(glob.glob("out-*/page-*.png")):
              tag = p.split("/")[0].replace("out-", "")
              im = Image.open(p)
              # 裁顶部一半 + 整页缩略
              w, h = im.size
              im.resize((620, int(620 * h / w)), Image.LANCZOS).save(
                  f"preview/{tag}-{os.path.basename(p)[:-4]}-small.jpg", quality=82)
              # 顶部 40% 局部放大（看笔迹细节）
              crop = im.crop((0, int(h*0.10), w, int(h*0.32)))
              cw, ch = crop.size
              crop.resize((760, int(760*ch/cw)), Image.LANCZOS).save(
                  f"preview/{tag}-{os.path.basename(p)[:-4]}-zoom.jpg", quality=88)
          for f in sorted(os.listdir("preview")):
              print(f, os.path.getsize("preview/"+f), "B")
          EOF

      - name: 上传小预览（小文件，手机秒下）
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/*.jpg
          if-no-files-found: error

      - name: 上传完整样张
        uses: actions/upload-artifact@v4
        with:
          name: handwrite-sample
          path: |
            out-*/page-*.png
            out-*/handwrite.pdf
          if-no-files-found: error
          compression-level: 9
