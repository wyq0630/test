name: handwrite

# 用字体渲染 A4 手写页（字体在 CI 侧下载，本机不下 15MB）
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装依赖
        run: |
          pip install --quiet pillow numpy

      - name: 下字体（Yozai 手写 + 霞鹜文楷 对照）
        run: |
          mkdir -p fonts
          curl -sSL -H "Accept: application/octet-stream" -o fonts/Yozai.ttf \
            "https://api.github.com/repos/lxgw/yozai-font/releases/assets/292424918"
          curl -sSL -H "Accept: application/octet-stream" -o fonts/WenKai.ttf \
            "https://api.github.com/repos/lxgw/LxgwWenKai/releases/assets/375817996"
          ls -la fonts/

      - name: 渲染 Yozai（手写感）
        run: |
          python3 src-demo/handwrite.py --font fonts/Yozai.ttf \
            --text src-demo/content.txt --out out-yozai --seed 7

      - name: 渲染 WenKai（楷体）
        run: |
          python3 src-demo/handwrite.py --font fonts/WenKai.ttf \
            --text src-demo/content.txt --out out-wenkai --seed 7

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: handwrite-pdf
          path: |
            out-yozai/handwrite.pdf
            out-wenkai/handwrite.pdf
          if-no-files-found: error
          compression-level: 9
