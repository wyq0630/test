name: handwrite

# 硬笔（志莽行）× 三档扰动对比
on:
  workflow_dispatch:
    inputs:
      pages: { description: "前 N 页", default: "1" }
      seed:  { description: "随机种子", default: "20261014" }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow numpy

      - name: 下字体
        run: |
          set -e
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fSL --retry 3 -o fonts/ZhiMangXing.ttf $B/zhimangxing/ZhiMangXing-Regular.ttf
          curl -fSL --retry 3 -o fonts/MaShanZheng.ttf $B/mashanzheng/MaShanZheng-Regular.ttf
          file fonts/*.ttf

      - name: 三档扰动（硬笔志莽行）
        run: |
          set -e
          for L in normal strong extreme; do
            echo "=== ZhiMangXing / $L ==="
            python3 src-demo/handwrite.py --font fonts/ZhiMangXing.ttf \
              --text src-demo/content.txt --out out-ZMX-$L \
              --pages "${{ inputs.pages }}" --seed "${{ inputs.seed }}" \
              --size-mm 8.6 --pitch-mm 8.8 --line-mm 11.6 --level $L
          done

      - name: 高扰动对照（马善政 extreme）
        run: |
          python3 src-demo/handwrite.py --font fonts/MaShanZheng.ttf \
            --text src-demo/content.txt --out out-MSZ-extreme \
            --pages "${{ inputs.pages }}" --seed "${{ inputs.seed }}" \
            --size-mm 8.6 --pitch-mm 8.8 --line-mm 11.6 --level extreme

      - name: 小预览
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import glob, os
          os.makedirs("preview", exist_ok=True)
          for p in sorted(glob.glob("out-*/page-*.png")):
              tag = p.split("/")[0].replace("out-", "")
              im = Image.open(p); w, h = im.size
              im.resize((600, int(600*h/w)), Image.LANCZOS).save(f"preview/{tag}-full.jpg", quality=80)
              crop = im.crop((0, int(h*0.115), w, int(h*0.30)))
              cw, ch = crop.size
              crop.resize((860, int(860*ch/cw)), Image.LANCZOS).save(f"preview/{tag}-zoom.jpg", quality=88)
          print("  ", sorted(os.listdir("preview")))
          EOF

      - uses: actions/upload-artifact@v4
        with: {name: preview, path: preview/*.jpg, if-no-files-found: error}
