name: handwrite

# 字体渲染 A4 手写页（无 AI 标识 —— 字体排版不属 AI 生成内容）
on:
  workflow_dispatch:
    inputs:
      pages:  { description: "前 N 页（0=全部）", default: "1" }
      seed:   { description: "随机种子", default: "20261014" }

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow numpy

      - name: 下字体（Google Fonts 直链，体积小、真手写源）
        run: |
          set -e
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fSL --retry 3 -o "fonts/$2" "$1"; }
          get $B/mashanzheng/MaShanZheng-Regular.ttf        MaShanZheng.ttf
          get $B/longcang/LongCang-Regular.ttf              LongCang.ttf
          get $B/zhimangxing/ZhiMangXing-Regular.ttf        ZhiMangXing.ttf
          get $B/liujianmaocao/LiuJianMaoCao-Regular.ttf    LiuJianMaoCao.ttf
          get $B/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf      ZCOOLXiaoWei.ttf
          get $B/zcoolqingkehuangyou/ZCOOLQingKeHuangYou-Regular.ttf ZCOOLQingKe.ttf
          file fonts/*.ttf
          ls -la fonts/

      - name: 渲染 6 种字体
        run: |
          set -e
          N="${{ inputs.pages }}"
          for f in MaShanZheng LongCang ZhiMangXing LiuJianMaoCao ZCOOLXiaoWei ZCOOLQingKe; do
            echo "=== $f ==="
            python3 src-demo/handwrite.py --font fonts/$f.ttf \
              --text src-demo/content.txt --out out-$f \
              --pages "$N" --seed "${{ inputs.seed }}" \
              --size-mm 8.6 --pitch-mm 8.6 --line-mm 11.6 \
              --rot 3.2 --jit 3.0 --scale 0.07 --drift 1.8
          done

      - name: 小预览
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import glob, os
          os.makedirs("preview", exist_ok=True)
          for p in sorted(glob.glob("out-*/page-*.png")):
              tag = p.split("/")[0].replace("out-", "")
              im = Image.open(p); w, h = im.size
              im.resize((600, int(600*h/w)), Image.LANCZOS).save(f"preview/{tag}-full.jpg", quality=80)
              crop = im.crop((0, int(h*0.12), w, int(h*0.30)))
              cw, ch = crop.size
              crop.resize((820, int(820*ch/cw)), Image.LANCZOS).save(f"preview/{tag}-zoom.jpg", quality=88)
          tot = sum(os.path.getsize("preview/"+f) for f in os.listdir("preview"))
          print(f"  preview 共 {tot/1024/1024:.2f} MB, {len(os.listdir('preview'))} 个")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/*.jpg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: full-pdf
          path: out-*/handwrite.pdf
          if-no-files-found: error
