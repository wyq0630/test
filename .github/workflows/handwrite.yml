name: handwrite

# 字体渲染 A4 手写页（无 AI 标识 —— 字体排版不属 AI 生成内容）
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "只出前 N 页（0=全部）"
        default: "2"
      seed:
        description: "随机种子（换一个就换一套扰动）"
        default: "20261014"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: pip install --quiet pillow numpy

      - name: 下字体（直链，不走 API —— runner 共享 IP 会撞匿名限流）
        run: |
          set -e
          mkdir -p fonts
          B=https://github.com
          get() {  # get <url> <out> <最小字节数>
            curl -fSL --retry 3 --retry-delay 2 -o "fonts/$2" "$1"
            sz=$(stat -c %s "fonts/$2")
            echo "  $2 -> $sz B"
            [ "$sz" -ge "$3" ] || { echo "!! $2 太小，可能下到错误页"; return 1; }
          }
          get $B/lxgw/yozai-font/releases/download/v0.868/Yozai-Medium.ttf        Yozai.ttf    10000000
          get $B/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Regular.ttf  WenKai.ttf   20000000
          get $B/lxgw/LxgwNeoXiHei/releases/download/v1.305/LXGWNeoXiHei.ttf      NeoXiHei.ttf  5000000
          echo "--- 文件类型校验 ---"
          file fonts/*.ttf
          ls -la fonts/

      - name: 渲染（3 种字体 × 前 N 页）
        run: |
          N="${{ inputs.pages }}"
          for f in Yozai WenKai NeoXiHei; do
            echo "=== $f ==="
            python3 src-demo/handwrite.py --font fonts/$f.ttf \
              --text src-demo/content.txt --out out-$f \
              --pages "$N" --seed "${{ inputs.seed }}"
          done

      - name: 上传样张
        uses: actions/upload-artifact@v4
        with:
          name: handwrite-sample
          path: |
            out-*/page-*.png
            out-*/handwrite.pdf
          if-no-files-found: error
          compression-level: 9
